# do not modify these
aoot: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window:
  - export UAV_NAME=uav1
  - export RUN_TYPE=simulation
  - export UAV_TYPE=x500
  - export PLATFORM_CONFIG=$(ros2 pkg prefix --share mrs_uav_gazebo_simulator)/config/mrs_uav_system/$UAV_TYPE.yaml
  - export RMW_IMPLEMENTATION=rmw_zenoh_cpp
  - export USE_SIM_TIME="true"
  - export WORLDS="$(ros2 pkg prefix --share mrs_gazebo_common_resources)/worlds"
startup_window: control
windows:
  - zenoh_router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - gazebo:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_gazebo_simulator simulation.launch.py world_file:="$WORLDS/forest.sdf"
        - ros2 launch mrs_uav_px4_api api.launch.py
  - rviz:
      layout: tiled
      panes:
        - waitForCore && ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=true
        - waitForCore && ros2 launch mrs_rviz_plugins load_robot.launch
  - spawn:
      layout: tiled
      panes:
        - 'waitForGazebo && ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "value: 1 --$UAV_TYPE --enable-rangefinder --enable-ouster"'
        # - 'waitForGazebo && ros2 service call /mrs_drone_spawner/spawn mrs_msgs/srv/String "value: 1 --$UAV_TYPE --enable-rangefinder --enable-rplidar"'
  - takeoff:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_autostart automatic_start.launch.py custom_config:=./config/automatic_start.yaml
        - waitForCore && ./takeoff.sh
  - status:
      layout: tiled
      panes:
        - ros2 run mrs_uav_status status.sh
  - bumper:
      layout: tiled
      panes:
        - ros2 launch mrs_bumper bumper.launch.py
  - control:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_core core.launch.py platform_config:=$PLATFORM_CONFIG custom_config:=./config/custom_config.yaml world_config:=./config/world_config.yaml network_config:=./config/network_config.yaml
  - gazebo_camera_follow:
      layout: tiled
      panes:
        - 'waitForGazebo && sleep 2; gz topic -t /gui/track -m gz.msgs.CameraTrack -p "track_mode: 2 follow_target { name: \"$UAV_NAME\" }"'
        - waitForCore && sleep 2; ~/.i3/layout_manager.sh ./layout.json
